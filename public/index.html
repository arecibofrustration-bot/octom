
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 560px;
    }

    .error-code {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 600;
      letter-spacing: -1.5px;
      margin: 0 0 16px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #555;
      margin: 0 0 12px;
    }

    hr {
      border: 0;
      border-top: 1px solid #e5e5e5;
      margin: 28px 0;
    }

    a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #666;
    }

    footer {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <div class="error-code">ERROR 404</div>

    <h1>Page not found.</h1>

    <p>
      The page you're looking for doesn't exist
      or may have been moved.
    </p>

    <p>
      Check the URL and try again.
    </p>

    <hr>

    <footer>
      Nothing to see here.
    </footer>
  </main>
</body>
</html>
